name: Check OU Escape Route Auth Service

on:
  pull_request:
    paths:
      - 'auth-service/**'
      - '.github/workflows/check-auth-service.yml'
  push:
    branches: [main, master, 'feature/**']
    paths:
      - 'auth-service/**'
      - '.github/workflows/check-auth-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify service health and fail-closed behavior
        run: |
          PORT=8080 node server.js > /tmp/auth-service.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/auth-health.json; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:8080';
          const health = await (await fetch(base + '/health')).json();
          assert.equal(health.ok, true);
          assert.equal(health.configured, false);
          for (const path of ['/v1/auth/register', '/v1/auth/login', '/v1/auth/login-pin', '/v1/auth/pin']) {
            const response = await fetch(base + path, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ email: 'test@example.com', username: 'testuser', identifier: 'testuser', password: 'not-a-real-password', pin: '123456' })
            });
            assert.equal(response.status, 503, path + ' must reject requests when the database/JWT secret are not configured');
          }
          console.log('Health and fail-closed authentication checks passed.');
          NODE
