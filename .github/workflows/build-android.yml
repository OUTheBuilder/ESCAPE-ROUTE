name: Build OU Escape Route Android APK from Source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'OU-Escape-Route-Hybrid-ChatGPT-v3.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract uploaded project ZIP
        run: |
          test -f "OU-Escape-Route-Hybrid-ChatGPT-v3.zip"
          mkdir -p extracted-project
          unzip -q "OU-Escape-Route-Hybrid-ChatGPT-v3.zip" -d extracted-project
          test -f "extracted-project/OU-Escape-Route-Hybrid/android/gradlew"
          test -f "extracted-project/OU-Escape-Route-Hybrid/pnpm-lock.yaml"
          echo "PROJECT_DIR=extracted-project/OU-Escape-Route-Hybrid" >> "$GITHUB_ENV"

      - name: Apply email, username, and PIN sign-in UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("extracted-project/OU-Escape-Route-Hybrid")
          replacement = '''import{S as u,o as j,s as g,y as S,r,j as e,N as E,k as h}from"./vendor-CYxKxS8R.js";import{H as v}from"./Helmet-Ba_-bftk.js";import{u as b,A as C,I as x,E as L,B as N}from"./index-DNJc6yMG.js";import"./index-BbP3371Q.js";function B(){const{authState:o,onLogin:i}=b(),n=S(),[t,l]=r.useState(""),[c,f]=r.useState(""),[p,d]=r.useState(""),[m,y]=r.useState(""),[w,a]=r.useState(""),[busy,z]=r.useState(!1),[err,q]=r.useState(""),[mode,k]=r.useState("password");if(o.type==="authenticated")return e.jsx(E,{to:"/",replace:!0});const login=async(identifier,password)=>{const response=await fetch("https://ou-escape-route-auth.onrender.com/v1/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier,password})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||data.error||"Sign in failed. Check your details.");return data};const submit=async ev=>{ev.preventDefault();q("");z(!0);try{let data;if(mode==="pin"){const response=await fetch("https://ou-escape-route-auth.onrender.com/v1/auth/login-pin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:p})});data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||data.error||"PIN sign-in failed.")}else{data=await login(t,c);if(mode==="setpin"){if(!/^\\d{6}$/.test(p))throw new Error("Choose a 6-digit PIN.");const response=await fetch("https://ou-escape-route-auth.onrender.com/v1/auth/pin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+data.token},body:JSON.stringify({pin:p})});const pinData=await response.json().catch(()=>({}));if(!response.ok)throw new Error(pinData.message||pinData.error||"Could not save PIN.")}}if(data.token)localStorage.setItem("ouer_auth_token",data.token);if(!data.user)throw new Error("The auth service did not return a user profile.");i(data.user);n("/",{replace:!0})}catch(ex){q(ex instanceof Error?ex.message:"Sign in failed.")}finally{z(false)}};return e.jsxs(C,{title:"Welcome back",onSubmit:submit,children:[e.jsx(v,{children:e.jsx("title",{children:"Sign in · OU Escape Route"})}),e.jsxs("div",{style:{display:"flex",gap:8,marginBottom:16},children:[e.jsx("button",{type:"button",onClick:()=>k("password"),children:"Email / Username + Password"}),e.jsx("button",{type:"button",onClick:()=>k("pin"),children:"PIN"}),e.jsx("button",{type:"button",onClick:()=>k("setpin"),children:"Set PIN"})]}),mode!=="pin"&&e.jsx(x,{type:"text",placeholder:mode==="password"?"Email address":"Email address or username",autoComplete:"username",value:t,onChange:a=>l(a.target.value),required:!0}),mode!=="pin"&&e.jsx(x,{type:"password",placeholder:"Password",autoComplete:"current-password",value:c,onChange:a=>f(a.target.value),required:!0}),mode!=="password"&&e.jsx(x,{type:"password",placeholder:mode==="pin"?"6-digit PIN":"Create 6-digit PIN",inputMode:"numeric",autoComplete:"off",value:p,onChange:a=>d(a.target.value.replace(/\\D/g,"").slice(0,6)),required:!0}),e.jsx(L,{children:err}),e.jsx(N,{type:"submit",variant:"primary",size:"lg",disabled:busy,children:busy?"Please wait…":mode==="pin"?"Sign in with PIN":mode==="setpin"?"Save PIN and sign in":"Sign In"}),e.jsx("p",{children:e.jsx(h,{to:"/forgot-password",children:"Forgot password?"})}),e.jsxs("p",{children:["No account? ",e.jsx(h,{to:"/register",children:"Create one"})]})]})}export{B as default};'''
          targets = [
            project / "android/app/src/main/assets/public/_assets/login-Db9WOtM3.js",
            project / "android/app/src/main/assets/public/client/_assets/login-Db9WOtM3.js",
          ]
          for path in targets:
            if not path.exists(): raise SystemExit(f"Login bundle not found: {path}")
            path.write_text(replacement)
            print(f"Updated sign-in UI: {path}")
          PY
      - name: Reset app to landing page and sign out when it goes to background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("extracted-project/OU-Escape-Route-Hybrid")
          script = """<script>
          (() => {
            let backgrounded = false;
            let logoutStarted = false;
            const signOut = () => {
              if (logoutStarted) return;
              logoutStarted = true;
              try {
                sessionStorage.setItem("__ouer_return_to_landing", "1");
                fetch("/_api/auth/logout", {
                  method: "POST",
                  credentials: "same-origin",
                  headers: {"Content-Type": "application/json"},
                  body: "{}",
                  keepalive: true
                }).catch(() => {});
              } catch (_) {}
            };
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "hidden") {
                backgrounded = true;
                signOut();
              } else if (document.visibilityState === "visible" && backgrounded) {
                backgrounded = false;
                logoutStarted = false;
                try { sessionStorage.removeItem("__ouer_return_to_landing"); } catch (_) {}
                window.location.replace("/");
              }
            });
            window.addEventListener("pagehide", signOut);
          })();
          </script>"""
          targets = [
            project / "android/app/src/main/assets/public/index.html",
            project / "android/app/src/main/assets/public/client/index.html",
          ]
          for path in targets:
            if not path.exists():
              raise SystemExit(f"Expected app HTML not found: {path}")
            html = path.read_text()
            if "__ouer_return_to_landing" not in html:
              html = html.replace("</head>", script + "</head>", 1)
              path.write_text(html)
            print(f"Added background sign-out and landing-page reset: {path}")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: extracted-project/OU-Escape-Route-Hybrid/pnpm-lock.yaml

      - name: Install project dependencies
        run: cd "$PROJECT_DIR" && pnpm install --frozen-lockfile

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Check for hard-coded AAPT2 override
        run: |
          echo "Checking project Gradle configuration for a custom AAPT2 path..."
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.gradle \
            -E "aapt2FromMavenOverride|aapt2-maven|AAPT2" "$PROJECT_DIR/android" "$PROJECT_DIR" 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew --stop || true
          ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.aapt2FromMavenOverride=""

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: extracted-project/OU-Escape-Route-Hybrid/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
