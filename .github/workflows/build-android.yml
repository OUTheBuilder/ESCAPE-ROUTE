name: Build OU Escape Route Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'OU-Escape-Route-Hybrid-ChatGPT-v3.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract uploaded project ZIP
        run: |
          test -f "OU-Escape-Route-Hybrid-ChatGPT-v3.zip"
          mkdir -p extracted-project
          unzip -q "OU-Escape-Route-Hybrid-ChatGPT-v3.zip" -d extracted-project
          test -f "extracted-project/OU-Escape-Route-Hybrid/android/gradlew"
          test -f "extracted-project/OU-Escape-Route-Hybrid/pnpm-lock.yaml"
          echo "PROJECT_DIR=extracted-project/OU-Escape-Route-Hybrid" >> "$GITHUB_ENV"

      - name: Reset app to landing page and sign out when it goes to background
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("extracted-project/OU-Escape-Route-Hybrid")
          script = """<script>
          (() => {
            let backgrounded = false;
            let logoutStarted = false;
            const signOut = () => {
              if (logoutStarted) return;
              logoutStarted = true;
              try {
                sessionStorage.setItem("__ouer_return_to_landing", "1");
                fetch("/_api/auth/logout", {
                  method: "POST",
                  credentials: "same-origin",
                  headers: {"Content-Type": "application/json"},
                  body: "{}",
                  keepalive: true
                }).catch(() => {});
              } catch (_) {}
            };
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "hidden") {
                backgrounded = true;
                signOut();
              } else if (document.visibilityState === "visible" && backgrounded) {
                backgrounded = false;
                logoutStarted = false;
                try { sessionStorage.removeItem("__ouer_return_to_landing"); } catch (_) {}
                window.location.replace("/");
              }
            });
            window.addEventListener("pagehide", signOut);
          })();
          </script>"""
          targets = [
            project / "android/app/src/main/assets/public/index.html",
            project / "android/app/src/main/assets/public/client/index.html",
          ]
          for path in targets:
            if not path.exists():
              raise SystemExit(f"Expected app HTML not found: {path}")
            html = path.read_text()
            if "__ouer_return_to_landing" not in html:
              html = html.replace("</head>", script + "</head>", 1)
              path.write_text(html)
            print(f"Added background sign-out and landing-page reset: {path}")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: extracted-project/OU-Escape-Route-Hybrid/pnpm-lock.yaml

      - name: Install project dependencies
        run: cd "$PROJECT_DIR" && pnpm install --frozen-lockfile

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Check for hard-coded AAPT2 override
        run: |
          echo "Checking project Gradle configuration for a custom AAPT2 path..."
          grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.gradle \
            -E "aapt2FromMavenOverride|aapt2-maven|AAPT2" "$PROJECT_DIR/android" "$PROJECT_DIR" 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          ./gradlew --stop || true
          ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.aapt2FromMavenOverride=""

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: extracted-project/OU-Escape-Route-Hybrid/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
