name: Build OU Escape Route Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'escape-route-project-icon-updated.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract the uploaded project
        run: |
          test -f "escape-route-project-icon-updated.zip"
          mkdir -p extracted-project
          unzip -q "escape-route-project-icon-updated.zip" -d extracted-project
          test -f "extracted-project/android/gradlew"
          test -f "extracted-project/android/app/build.gradle"
          test -f "extracted-project/android/variables.gradle"
          echo "PROJECT_DIR=extracted-project" >> "$GITHUB_ENV"
          echo "Android project structure verified."

      - name: Set up Java 18
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '18'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Build debug APK
        run: |
          chmod +x "$PROJECT_DIR/android/gradlew"
          cd "$PROJECT_DIR/android"
          ./gradlew --stop || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          APK="$PROJECT_DIR/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: extracted-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
