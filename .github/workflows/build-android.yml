name: Build OU Escape Route Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'escape-route-project-icon-updated.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ runner.tool_cache }}/android-sdk

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract the uploaded Escape Route project
        run: |
          test -f "escape-route-project-icon-updated.zip"
          mkdir -p extracted-project
          unzip -q "escape-route-project-icon-updated.zip" -d extracted-project
          test -f "extracted-project/android/gradlew"
          test -f "extracted-project/package.json"
          test -f "extracted-project/pnpm-lock.yaml"
          test -f "extracted-project/android/app/src/main/assets/public/index.html"

      - name: Make Gradle wrapper executable
        run: chmod +x extracted-project/android/gradlew

      - name: Set up Java 18 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '18'

      - name: Print Java & Gradle diagnostics
        working-directory: extracted-project/android
        run: |
          echo "=== java -version ==="
          java -version || true
          echo "=== gradlew -v ==="
          ./gradlew -v || true
          echo "=== gradle-wrapper.properties ==="
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then cat gradle/wrapper/gradle-wrapper.properties; fi
          echo "=== Search for Android Gradle Plugin in build files ==="
          grep -R --line-number "com.android.tools.build:gradle" . || true
          echo "=== Show top of android/build.gradle (if present) ==="
          if [ -f build.gradle ]; then head -n 200 build.gradle; fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: extracted-project/pnpm-lock.yaml

      - name: Install project dependencies
        run: cd extracted-project && pnpm install --frozen-lockfile

      - name: Set up Android SDK (platform-tools)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Build debug APK from the uploaded project
        working-directory: extracted-project/android
        run: |
          ./gradlew --no-daemon --stop || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-uploaded-project-debug-apk
          path: extracted-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
