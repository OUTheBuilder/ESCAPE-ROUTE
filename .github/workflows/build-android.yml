name: Build OU Escape Route Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'OU-Escape-Route-Hybrid-ChatGPT-v3.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Extract uploaded project ZIP
        run: |
          test -f "OU-Escape-Route-Hybrid-ChatGPT-v3.zip"
          mkdir -p extracted-project
          unzip -q "OU-Escape-Route-Hybrid-ChatGPT-v3.zip" -d extracted-project
          test -f "extracted-project/OU-Escape-Route-Hybrid/android/gradlew"
          test -f "extracted-project/OU-Escape-Route-Hybrid/pnpm-lock.yaml"
          echo "PROJECT_DIR=extracted-project/OU-Escape-Route-Hybrid" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: extracted-project/OU-Escape-Route-Hybrid/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install project dependencies
        run: cd "$PROJECT_DIR" && pnpm install --frozen-lockfile

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Build debug APK
        run: cd "$PROJECT_DIR/android" && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: extracted-project/OU-Escape-Route-Hybrid/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
