name: Build OU Escape Route Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'OU-Escape-Route-Hybrid-ChatGPT-v3.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          test -f "OU-Escape-Route-Hybrid-ChatGPT-v3.zip"
          mkdir -p extracted-project
          unzip -q "OU-Escape-Route-Hybrid-ChatGPT-v3.zip" -d extracted-project
          test -f "extracted-project/OU-Escape-Route-Hybrid/android/gradlew"
          echo "PROJECT_DIR=extracted-project/OU-Escape-Route-Hybrid" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Build debug APK
        working-directory: .
        run: cd "$PROJECT_DIR/android" && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: extracted-project/OU-Escape-Route-Hybrid/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
