<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>OU Escape Route — Independent Rebuild</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#111b2c;--line:#283852;--text:#edf4ff;--muted:#9caec8;--blue:#5ea5ff;--cyan:#54e0d0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#142746 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}.app{max-width:1050px;margin:auto;padding:16px}.top,.brand,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{justify-content:flex-start}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#07111e;font-weight:950}.brand h1{font-size:17px;margin:0}.muted,.brand p{color:var(--muted)}.brand p{font-size:11px;margin:2px 0}.layout{display:grid;grid-template-columns:180px 1fr;gap:18px;margin-top:20px}.side{display:flex;flex-direction:column;gap:6px}.nav,.btn{padding:11px;border-radius:10px;border:1px solid #2d4567;background:transparent;color:var(--text);cursor:pointer}.nav{text-align:left;color:var(--muted)}.nav.active,.nav:hover{background:#17243a;color:white}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#07111e;border:0;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,#142036,#101a2b);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.wide{grid-column:1/-1}.card h3{margin:0 0 12px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:12px;color:#c3d1e5}.field input,.field textarea{width:100%;background:#0a1422;color:white;border:1px solid #30415b;border-radius:9px;padding:11px}.field textarea{min-height:80px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.action{background:#0e1929;color:white;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer}.action small{display:block;color:var(--muted);margin-top:4px}.item{display:flex;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:7px 0}.hidden{display:none!important}.auth{max-width:450px;margin:7vh auto;padding:14px}.authbox{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:24px}.authbox h2{margin:22px 0 5px}.tabs{display:flex;gap:4px;margin:15px 0}.tab{flex:1;padding:9px;background:#0a1422;color:var(--muted);border:1px solid var(--line);border-radius:9px;cursor:pointer}.tab.active{background:#203752;color:white}.notice{font-size:12px;padding:11px;border:1px solid #66523a;background:#2b2419;color:#ffe1ad;border-radius:10px;margin:12px 0}.check{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.footer{text-align:center;color:#71849f;font-size:11px;padding:22px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(3,1fr)}.nav{text-align:center;font-size:11px;padding:9px 3px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.app{padding:12px}.top{align-items:flex-start;flex-wrap:wrap}}@media(max-width:370px){.actions{grid-template-columns:1fr}}
</style></head><body>
<section id="auth" class="auth"><div class="authbox"><div class="brand"><div class="logo">ER</div><div><h1>OU ESCAPE ROUTE</h1><p>Independent ChatGPT rebuild</p></div></div><h2>Choose how to sign in</h2><p class="muted">Demo only. Do not enter real credentials.</p><div class="tabs"><button class="tab active" data-mode="email">Email</button><button class="tab" data-mode="username">Username</button><button class="tab" data-mode="pin">PIN</button></div><form id="login"><div id="emailFields"><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="epass" type="password" placeholder="Demo password"></div></div><div id="userFields" class="hidden"><div class="field"><label>Username</label><input id="username" placeholder="Username"></div><div class="field"><label>Password</label><input id="upass" type="password" placeholder="Demo password"></div></div><div id="pinFields" class="hidden"><div class="field"><label>4–8 digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8"></div></div><button class="btn primary" style="width:100%">Continue to demo</button></form><p class="muted" style="font-size:11px">Authentication is simulated, not secure. Real account service is pending.</p></div></section>
<div id="workspace" class="app hidden"><header class="top"><div class="brand"><div class="logo">ER</div><div><h1>OU ESCAPE ROUTE</h1><p>Independent rebuild · local demo</p></div></div><button id="logout" class="btn">Sign out</button></header><div class="layout"><nav class="side"><button class="nav active" data-page="home">⌂ Overview</button><button class="nav" data-page="routes">↗ Route planner</button><button class="nav" data-page="contacts">♡ Contacts</button><button class="nav" data-page="checklist">☑ Checklist</button><button class="nav" data-page="saved">▣ Saved notes</button><button class="nav" data-page="settings">⚙ Settings</button></nav><main id="main"></main></div><div class="footer">Provisional starter · no Floot runtime connection</div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s)),get=(k,d)=>{try{return JSON.parse(localStorage.getItem('ouer_'+k))||d}catch(e){return d}},put=(k,v)=>localStorage.setItem('ouer_'+k,JSON.stringify(v)),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mode='email',page='home',user=get('user',null),contacts=get('contacts',[]),notes=get('notes',[]),checks=get('checks',{water:false,phone:false,documents:false,meeting:false}),route=get('route',{start:'Current location',dest:'Safe meeting point',notes:''});
$$('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$$('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('#emailFields').classList.toggle('hidden',mode!=='email');$('#userFields').classList.toggle('hidden',mode!=='username');$('#pinFields').classList.toggle('hidden',mode!=='pin')});
$('#login').onsubmit=e=>{e.preventDefault();let label=mode==='email'?$('#email').value.trim():mode==='username'?$('#username').value.trim():'PIN user',ok=mode==='email'?label&&$('#epass').value:mode==='username'?label&&$('#upass').value:/^\d{4,8}$/.test($('#pin').value);if(!ok){alert('Complete the demo sign-in fields. PIN must be 4–8 digits.');return}user={label:label,mode:mode};put('user',user);openApp()};
$('#logout').onclick=()=>{user=null;put('user',null);$('#workspace').classList.add('hidden');$('#auth').classList.remove('hidden')};
function card(title,body,wide){return '<section class="card '+(wide?'wide':'')+'"><h3>'+title+'</h3>'+body+'</section>'}
function action(title,desc,go){return '<button class="action" data-go="'+go+'"><b>'+title+'</b><small>'+desc+'</small></button>'}
function render(){let h='';
if(page==='home')h='<h2>Welcome, '+esc(user.label)+'</h2><p class="muted">This is a provisional working shell, not a verified clone. Original screens and app rules are not yet verified.</p><div class="notice">The original website could not be fetched in this session. The modules below are assumptions, not confirmed original features.</div><div class="grid">'+card('Quick actions','<div class="actions">'+action('Route planner','Save route details','routes')+action('Contacts','Manage contacts','contacts')+action('Checklist','Track essentials','checklist')+action('Saved notes','Store notes locally','saved')+'</div>',true)+card('Route summary','<p><b>'+esc(route.start)+'</b> → <b>'+esc(route.dest)+'</b></p><p class="muted">No GPS or live navigation.</p><button class="btn" data-go="routes">Edit route</button>')+card('Checklist progress','<h2>'+Object.values(checks).filter(Boolean).length+' / '+Object.keys(checks).length+'</h2><p class="muted">Saved in this browser.</p>')+'</div>';
if(page==='routes')h='<h2>Route planner</h2><p class="muted">Save a text description; no live maps.</p><div class="grid">'+card('Route details','<form id="routeForm"><div class="field"><label>Starting point</label><input id="start" required value="'+esc(route.start)+'"></div><div class="field"><label>Destination</label><input id="dest" required value="'+esc(route.dest)+'"></div><div class="field"><label>Notes</label><textarea id="rnotes">'+esc(route.notes)+'</textarea></div><button class="btn primary">Save route</button></form>',true)+'<div class="notice">GPS, map provider, route calculation, and offline maps are not implemented.</div></div>';
if(page==='contacts')h='<h2>Contacts</h2><div class="grid">'+card('Add contact','<form id="cf"><div class="field"><label>Name</label><input id="cn" required></div><div class="field"><label>Phone</label><input id="cp"></div><div class="field"><label>Relationship</label><input id="cr"></div><button class="btn primary">Save contact</button></form>')+card('Saved contacts',contacts.map((c,i)=>'<div class="item"><span>'+esc(c.name)+'<small class="muted">'+esc(c.phone)+'</small></span><button class="btn" data-delc="'+i+'">Remove</button></div>').join('')||'<p class="muted">No contacts yet.</p>')+'</div>';
if(page==='checklist')h='<h2>Checklist</h2><p class="muted">Generic checklist; follow official local instructions.</p>'+card('Essentials',['water|Water / supplies','phone|Charged phone / power bank','documents|Important documents / IDs','meeting|Agreed meeting point'].map(s=>{let a=s.split('|');return '<label class="check"><input type="checkbox" data-check="'+a[0]+'" '+(checks[a[0]]?'checked':'')+'>'+a[1]+'</label>'}).join('')+'<button id="reset" class="btn">Reset checklist</button>',true);
if(page==='saved')h='<h2>Saved notes</h2><div class="grid">'+card('New note','<form id="nf"><div class="field"><label>Title</label><input id="nt" required></div><div class="field"><label>Details</label><textarea id="nb"></textarea></div><button class="btn primary">Save note</button></form>')+card('Your notes',notes.map((n,i)=>'<div class="item"><span>'+esc(n.title)+'<small class="muted">'+esc(n.body)+'</small></span><button class="btn" data-deln="'+i+'">Delete</button></div>').join('')||'<p class="muted">No notes yet.</p>')+'</div>';
if(page==='settings')h='<h2>Settings</h2>'+card('Demo status','<p>Signed in as '+esc(user.label)+' via '+esc(user.mode)+'.</p><p class="muted">Local browser storage; no backend or cloud sync.</p><button id="clear" class="btn">Clear demo data</button><div class="notice">Pending: secure authentication, verified feature parity, production backend, tests, and independent deployment.</div>',true);
$('#main').innerHTML=h;$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
if($('#routeForm'))$('#routeForm').onsubmit=e=>{e.preventDefault();route={start:$('#start').value,dest:$('#dest').value,notes:$('#rnotes').value};put('route',route);alert('Saved locally.')};
if($('#cf'))$('#cf').onsubmit=e=>{e.preventDefault();contacts.push({name:$('#cn').value,phone:$('#cp').value,relation:$('#cr').value});put('contacts',contacts);render()};
if($('#nf'))$('#nf').onsubmit=e=>{e.preventDefault();notes.unshift({title:$('#nt').value,body:$('#nb').value});put('notes',notes);render()};
$$('[data-delc]').forEach(b=>b.onclick=()=>{contacts.splice(+b.dataset.delc,1);put('contacts',contacts);render()});$$('[data-deln]').forEach(b=>b.onclick=()=>{notes.splice(+b.dataset.deln,1);put('notes',notes);render()});
$$('[data-check]').forEach(b=>b.onchange=()=>{checks[b.dataset.check]=b.checked;put('checks',checks);render()});if($('#reset'))$('#reset').onclick=()=>{Object.keys(checks).forEach(k=>checks[k]=false);put('checks',checks);render()};
if($('#clear'))$('#clear').onclick=()=>{if(confirm('Clear local demo data?')){['user','contacts','notes','checks','route'].forEach(k=>localStorage.removeItem('ouer_'+k));location.reload()}}
}
function show(p){page=p;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}$$('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));function openApp(){$('#auth').classList.add('hidden');$('#workspace').classList.remove('hidden');show(page)}if(user)openApp();
</script></body></html>
